
esphome:
  name: iflo
  friendly_name: iflo
  on_boot:
    priority: 600
    then:
      - light.turn_on:
         id: LED1
         effect: "fast_blinking"
      - light.turn_on:
          id: LED2
          effect: "fast_blinking"
      - switch.turn_off: motor_in1
      - switch.turn_on: motor_in2
      - delay: 250ms
      - switch.turn_off: motor_in1
      - switch.turn_off: motor_in2
      - text_sensor.template.publish:
          id: command_status
          state: Redy To Dispense
      - component.update: dispenses_left
      - component.update: volume_left
      - select.set:
          id: dispense_schedule
          option: !lambda return id(schedule_option);
      - select.set:
          id: dispense_amount_select
          option: !lambda return id(volume_option);
      - script.execute: calculate_next_dispense
      - if:
          condition:
          - binary_sensor.is_on: bottle_sensor
          - sensor.in_range:
              id: volume_left
              above: 0
          then:
            - light.turn_off: LED4
            - text_sensor.template.publish:
                id: bottle_status_ui
                state: "Installed"
          else:
            - light.turn_on: LED4
            - text_sensor.template.publish:
                id: command_status
                state: Insufficent Fluid
            - text_sensor.template.publish:
                id: bottle_status_ui
                state: "Empty"
      - if:
          condition:
            binary_sensor.is_off: bottle_sensor
          then:
            - lambda: |
                ESP_LOGW("boot", "No bottle detected at startup! Setting volume to 0.");
                id(remaining_volume) = 0;
            - component.update: volume_left
            - component.update: dispenses_left
            - text_sensor.template.publish:
                id: command_status
                state: No Bottle Installed
            - text_sensor.template.publish:
                id: bottle_status_ui
                state: "Removed"
            - light.turn_on: LED4
          else:
            - text_sensor.template.publish:
                id: command_status
                state: Redy To Dispense
            - text_sensor.template.publish:
                id: bottle_status_ui
                state: "Installed"
            - light.turn_off: LED4
      - light.turn_on:
         id: LED1
         effect: none
      - logger.log: "Executing initial boot-time battery level verification..."
      - component.update: battery_voltage 
      - delay: 50ms
      - component.update: battery_percentage

        
esp32:
  variant: ESP32S2
  flash_size: 4MB
  framework:
    type: esp-idf

    
logger:
  level: INFO

  
api:
  encryption:
    key: "7As1BjSMbBAg/oCyk2r9QykxKZLqS8zqQUTlk07ptSY="

    
ota:
  - platform: esphome
    encryption:

      
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: iflo Fallback Hotspot
    password: iflo1234
  on_connect:
    then:
      - light.turn_on:
          id: LED2
          effect: none 
  on_disconnect:
    then:
      - light.turn_on:
          id: LED2
          effect: "fast_blinking"
    
  power_save_mode: HIGH
  fast_connect: true

  
captive_portal:

  
globals:
  - id: remaining_volume
    type: int
    restore_value: true
    initial_value: "36"
    
  - id: last_remaining_volume
    type: int
    restore_value: true
    initial_value: "36"
    
  - id: schedule_option
    type: std::string
    initial_value: '"Off"' 
    restore_value: true
    
  - id: volume_option
    type: std::string
    initial_value: '"6 oz"'
    restore_value: true
    
  - id: last_dispense
    type: std::string
    initial_value: '"Never"' 
    restore_value: true
    
  - id: days_since_dispense
    type: int
    restore_value: true
    initial_value: "0" 

    
web_server:
  port: 80
  version: 3
  auth:
    username: iflo
    password: !secret test__web_password

    
switch:
  - platform: gpio
    pin: GPIO9
    id: motor_in1
    internal: true 
    restore_mode: ALWAYS_OFF

  - platform: gpio
    pin: GPIO10
    id: motor_in2
    internal: true
    restore_mode: ALWAYS_OFF

    
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO6
      mode: INPUT_PULLUP
      inverted: true
    name: "Front Button"
    internal: true
    on_click:
      - min_length: 350ms
        max_length: 3000ms
        then:
          - script.execute: dispense_sequence
      - min_length: 5000ms
        max_length: 10000ms
        then:
          - script.execute: reset_sequence

  - platform: gpio
    pin:
      number: GPIO13
      mode: INPUT_PULLUP
      inverted: true
    id: bottle_sensor
    name: "Bottle Sensor"
    icon: "mdi:bottle-tonic-outline"
    internal: true
    on_state:
      then:
        - if:
            condition:
              - binary_sensor.is_on: bottle_sensor
            then:
              - light.turn_off: LED4
              - text_sensor.template.publish:
                  id: bottle_status_ui
                  state: "Installed"
            else:
              - light.turn_on: LED4
              - text_sensor.template.publish:
                 id: bottle_status_ui
                 state: "Removed"
    on_release:
      then:
        - lambda: |-
            ESP_LOGW("bottle", "Bottle Removed!");
            id(remaining_volume) = 0;
        - component.update: volume_left
        - component.update: dispenses_left
        - text_sensor.template.publish:
            id: command_status
            state: "Bottle Removed"
        - text_sensor.template.publish:
                id: bottle_status_ui
                state: "Removed"
        - light.turn_on: LED4
    on_press:
      then:
        - lambda: |-
            ESP_LOGW("bottle", "Bottle Installed!");
            id(remaining_volume) = id(last_remaining_volume);
        - component.update: volume_left
        - component.update: dispenses_left
        - text_sensor.template.publish:
            id: command_status
            state: "Bottle Installed"
        - text_sensor.template.publish:
                id: bottle_status_ui
                state: "Installed"
        - light.turn_off: LED4

          
text_sensor:
  - platform: template
    name: "Iflo Status"
    id: command_status
    icon: "mdi:message-text-clock"

  - platform: template
    name: "Last Dispense"
    id: last_dispense_ui
    icon: "mdi:clock-check-outline"
    lambda: |-
      return id(last_dispense);

  - platform: template
    name: "Next Dispense"
    id: next_dispense_ui
    icon: "mdi:calendar-clock"

  - platform: template
    name: "Bottle Status"
    id: bottle_status_ui
    icon: "mdi:bottle-tonic-outline"


select:
  - platform: template
    name: "Dispense Schedule"
    id: dispense_schedule
    icon: "mdi:calendar"
    optimistic: true
    options:
      - "Off"
      - "Every 7 Days"
      - "Every 14 Days"
      - "Every 30 Days"
      - "1st of Month"
      - "1st & 15th of Month"
    initial_option: "Off"
    on_value:
      then:
        - globals.set:
            id: schedule_option
            value: !lambda 'return x;'
        - script.execute: calculate_next_dispense 
            
  - platform: template
    name: "Dispense Amount"
    id: dispense_amount_select
    icon: "mdi:water-opacity"
    optimistic: true
    options:
      - "3 oz"
      - "6 oz"
      - "9 oz"
      - "12 oz"
    initial_option: "6 oz"
    on_value:
      then:
        - globals.set:
            id: volume_option
            value: !lambda 'return x;'
        - component.update: dispenses_left

          
sensor:
  - platform: template
    name: "Remaining Dispenses"
    id: dispenses_left
    unit_of_measurement: "dispenses"
    icon: "mdi:counter"
    accuracy_decimals: 0
    update_interval: never 
    lambda: |-
      int current_vol = id(remaining_volume);
      int port_size = atoi(id(volume_option).c_str());
      if (port_size <= 0) return 0; 
      return current_vol / port_size;

  - platform: template
    name: "Remaining Volume"
    id: volume_left
    unit_of_measurement: "oz"
    icon: "mdi:water-percent"
    accuracy_decimals: 0
    update_interval: never 
    lambda: |-
      return id(remaining_volume);
    on_value:
      then:
        - if:
            condition:
              - sensor.in_range:
                  id: volume_left
                  above: 0
            then:
              - light.turn_off: LED4
              - text_sensor.template.publish:
                  id: bottle_status_ui
                  state: "Installed"
            else:
              - light.turn_on: LED4
              - text_sensor.template.publish:
                  id: command_status
                  state: "Insufficent Fluid"
              - text_sensor.template.publish:
                  id: bottle_status_ui
                  state: "Installed"
              - if:
                  condition:
                    - binary_sensor.is_on: bottle_sensor
                  then:
                    - text_sensor.template.publish:
                        id: bottle_status_ui
                        state: "Empty"

  - platform: adc
    pin: GPIO8
    id: battery_voltage
    name: "Battery Voltage Raw"
    icon: "mdi:battery-outline"
    update_interval: 60s
    attenuation: 12dB
    filters:
      - multiply: 6.00  
      - sliding_window_moving_average:
          window_size: 5
          send_every: 1
    internal: true

  - platform: template
    name: "Battery Percentage"
    id: battery_percentage
    unit_of_measurement: "%"
    icon: "mdi:battery"
    accuracy_decimals: 0
    update_interval: 60s
    lambda: |-
      float volt = id(battery_voltage).state;
      if (std::isnan(volt) || volt <= 0.5) return 0;
      float pct = (volt - 4.00) / (5.35 - 4.00) * 100.0;
      if (pct > 100.0) pct = 100.0;
      if (pct < 0.0) pct = 0.0;
      if (pct <= 20.0) {
        auto call = id(LED3).turn_on();
        call.perform();
      } else {
        auto call = id(LED3).turn_off();
        call.perform();
      }
      return pct;

      
button:
  - platform: template
    name: "Manual Dispense"
    icon: "mdi:pump"
    on_press:
      - script.execute: dispense_sequence

  - platform: template
    name: "Reset Dispenses"
    icon: "mdi:restore"
    on_press:
      - script.execute: reset_sequence

        
output:
  - platform: ledc
    id: LED_1
    pin: GPIO39
  - platform: ledc
    id: LED_2
    pin: GPIO40
  - platform: ledc
    id: LED_3
    pin: GPIO41
  - platform: ledc
    id: LED_4
    pin: GPIO42

    
light:
  - platform: monochromatic
    id: LED1
    output: LED_1
    disabled_by_default: true
    effects:
      - strobe:
          name: fast_blinking
  - platform: monochromatic
    id: LED2
    output: LED_2
    disabled_by_default: true
    effects:
      - strobe:
          name: fast_blinking
  - platform: monochromatic
    id: LED3
    output: LED_3
    disabled_by_default: true
  - platform: monochromatic
    id: LED4
    output: LED_4
    disabled_by_default: true
number:
  - platform: template
    name: "Remaining Dispenses Override"
    id: set_dispenses_left
    icon: "mdi:restore-alert"
    min_value: 0
    max_value: 12  
    step: 1
    mode: box
    optimistic: true
    on_value:
      then:
        - lambda: |-
            int target_dispenses = (int)x;
            int port_size = atoi(id(volume_option).c_str());
            id(remaining_volume) = target_dispenses * port_size;
            ESP_LOGI("manual_override", "Manually typed dispenses left: %d (Volume: %d oz)", target_dispenses, id(remaining_volume));
        - component.update: volume_left
        - component.update: dispenses_left
        - script.execute: calculate_next_dispense  
script:
  - id: dispense_sequence
    mode: restart
    then:
      - light.turn_on:
         id: LED1
         effect: "fast_blinking"
      - if:
          condition:
            binary_sensor.is_off: bottle_sensor
          then:
            - text_sensor.template.publish:
                id: command_status
                state: Dispense Failed - No Bottle
            - lambda: |
                ESP_LOGI("main", "Dispense Failed, No bottle installed");
            - text_sensor.template.publish:
                id: bottle_status_ui
                state: Removed
            - light.turn_on: LED4
            - light.turn_on:
               id: LED1
               effect: none
            - script.stop: dispense_sequence
      - if:
          condition:
            lambda: |
              int requested_oz = atoi(id(volume_option).c_str());
              return id(remaining_volume) < requested_oz;
          then:
            - lambda: |
                ESP_LOGI("main", "Dispense Failed, Insufficent Fluid");            
            - text_sensor.template.publish:
                id: command_status
                state: Dispense Failed - No Fluid
            - text_sensor.template.publish:
                id: bottle_status_ui
                state: Empty
            - light.turn_on: LED4
            - light.turn_on:
               id: LED1
               effect: none
            - script.stop: dispense_sequence
      - text_sensor.template.publish:
          id: command_status
          state: Dispensing...
      - switch.turn_on: motor_in1
      - switch.turn_off: motor_in2
      - delay: 250ms
      - switch.turn_off: motor_in1
      - delay: !lambda |
          int runtime_seconds = atoi(id(volume_option).c_str());
          return runtime_seconds * 1000;
      - switch.turn_on: motor_in2
      - delay: 500ms
      - switch.turn_off: motor_in2
      - lambda: |
          int runtime_seconds = atoi(id(volume_option).c_str());
          id(remaining_volume) -= runtime_seconds;
          id(last_remaining_volume) -= runtime_seconds;
          id(days_since_dispense) = 0;
          id(last_dispense) = id(sntp_time).now().strftime("%Y-%m-%d %H:%M");
          id(last_dispense_ui).update();
          ESP_LOGI("main", "Timestamp updated! Last dispense recorded at: %s", id(last_dispense).c_str());
          id(calculate_next_dispense).execute();
      - component.update: dispenses_left
      - component.update: volume_left
      - if:
          condition:
            sensor.in_range:
              id: volume_left
              below: 1
              above: -1
          then:
              - text_sensor.template.publish:
                  id: bottle_status_ui
                  state: Empty
              - light.turn_on: LED4
              - lambda: |
                  ESP_LOGI("main", "Last Dispense, Bottle Empty");

      - text_sensor.template.publish:
          id: command_status
          state: Dispense Complete
      - light.turn_on:
          id: LED1
          effect: none

  - id: reset_sequence
    then:
      - light.turn_on:
         id: LED1
         effect: "fast_blinking"
      - if:
          condition:
            binary_sensor.is_off: bottle_sensor 
          then:
            - text_sensor.template.publish:
                id: command_status
                state: "Reset Failed - No Bottle"
            - lambda: |-
                id(remaining_volume) = 0;
                ESP_LOGI("main", "Reset Failed, No bottle installed");
            - component.update: volume_left
            - component.update: dispenses_left
            - text_sensor.template.publish:
                  id: bottle_status_ui
                  state: "Removed"
            - light.turn_on: LED4                
            - light.turn_on:
               id: LED1
               effect: none
            - script.stop: reset_sequence
          else:
            - lambda: |-
                id(remaining_volume) = 36;
                id(last_remaining_volume) = 36;
            - component.update: volume_left
            - component.update: dispenses_left
            - text_sensor.template.publish:
                id: command_status
                state: "Remaining Dispenses Reset"
            - text_sensor.template.publish:
                  id: bottle_status_ui
                  state: "Installed"
            - light.turn_on:
               id: LED1
               effect: none

  - id: calculate_next_dispense
    mode: restart 
    then:
      - lambda: |-
          std::string schedule = id(schedule_option);
          
          if (schedule == "Off") {
            id(next_dispense_ui).publish_state("Disabled");
            return;
          }
          auto time_now = id(sntp_time).now();
          esphome::ESPTime target_time = time_now;
          target_time.hour = 12;
          target_time.minute = 0;
          target_time.second = 0;
          target_time.recalc_timestamp_utc();
          if (schedule == "Every 7 Days" || schedule == "Every 14 Days" || schedule == "Every 30 Days") {
            int target_days = 7;
            if (schedule == "Every 14 Days") target_days = 14;
            if (schedule == "Every 30 Days") target_days = 30;
            int days_left = target_days - id(days_since_dispense);
            if (days_left < 0) days_left = 0;
            if (days_left == 0 || (days_left == target_days && time_now.hour >= 12)) {
              days_left = target_days;
            }
            time_t target_timestamp = target_time.timestamp + (days_left * 86400);
            target_time = esphome::ESPTime::from_epoch_local(target_timestamp);
          } 
          else if (schedule == "1st of Month" || schedule == "1st & 15th of Month") {
            if (time_now.day_of_month == 1 && time_now.hour >= 12) {
              target_time.day_of_month = (schedule == "1st & 15th of Month") ? 15 : 1;
              if (schedule == "1st of Month") target_time.month += 1;
            } 
            else if (time_now.day_of_month == 15 && time_now.hour >= 12) {
              target_time.day_of_month = 1;
              target_time.month += 1;
            } 
            else if (time_now.day_of_month < 15) {
              target_time.day_of_month = (schedule == "1st & 15th of Month") ? 15 : 1;
              if (schedule == "1st of Month") target_time.month += 1;
            } 
            else {
              target_time.day_of_month = 1;
              target_time.month += 1;
            }
            if (target_time.month > 12) {
              target_time.month = 1;
              target_time.year += 1;
            }
            target_time.recalc_timestamp_utc();
          }
          std::string formatted_time = target_time.strftime("%Y-%m-%d 12:00");
          id(next_dispense_ui).publish_state(formatted_time);
time:
  - platform: sntp
    id: sntp_time
    timezone: "America/Chicago" 
    
    on_time:
      # Daily Noon Dispense Trigger
      - cron: "0 0 12 * * *"
        then:
          - lambda: |-
              std::string current_schedule = id(schedule_option);
              if (current_schedule == "Off") return; 

              auto time_now = id(sntp_time).now();
              if (!time_now.is_valid() || time_now.year < 2020) return; 

              int day_of_month = time_now.day_of_month;
              bool should_dispense = false;

              if (day_of_month == 1 && (current_schedule == "1st of Month" || current_schedule == "1st & 15th of Month")) {
                should_dispense = true;
              }
              else if (day_of_month == 15 && current_schedule == "1st & 15th of Month") {
                should_dispense = true;
              }

              if (current_schedule == "Every 7 Days" || current_schedule == "Every 14 Days" || current_schedule == "Every 30 Days") {
                id(days_since_dispense) += 1;
                
                int target_days = 7;
                if (current_schedule == "Every 14 Days") target_days = 14;
                if (current_schedule == "Every 30 Days") target_days = 30;

                if (id(days_since_dispense) >= target_days) {
                  should_dispense = true;
                }
              }

              if (should_dispense) {
                id(dispense_sequence).execute();
              }

  